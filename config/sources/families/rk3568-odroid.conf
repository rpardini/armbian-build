source "${BASH_SOURCE%/*}/include/rockchip64_common.inc"

LINUXFAMILY="rk3568-odroid" # a separate family for this (separate kernel deb)
LINUXCONFIG='linux-rk3568-odroid-'$BRANCH
WIREGUARD="no"
SKIP_BOOTSPLASH="yes"

case $BRANCH in

	legacy)
		# Use the rk35xx legacy kernel as 3588's and rock3
		KERNELDIR='linux-rockchip64'
		KERNELSOURCE='https://github.com/armbian/linux-rockchip.git'
		declare -g KERNEL_MAJOR_MINOR="5.10" # Major and minor versions of this kernel.
		KERNELBRANCH='branch:rk-5.10-rkr6'
		KERNELPATCHDIR='rk35xx-legacy'
		LINUXFAMILY=rk35xx
		LINUXCONFIG='linux-rk35xx-legacy'
		;;

	edge)
		declare -g KERNEL_MAJOR_MINOR="6.6" # Major and minor versions of this kernel (for armbian-next)
		declare -g KERNELBRANCH='branch:linux-6.6.y'
		KERNELPATCHDIR='archive/rk3568-odroid-6.6' # @TODO fix # patches for overlays et al
		;;

esac

prepare_boot_configuration
