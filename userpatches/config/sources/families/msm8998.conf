# Activate needed extensions for this family (order is not important)
enable_extension "fastboot_image"
enable_extension "initramfs_usb_gadget"

export LINUXFAMILY=msm8998
export ARCH=arm64
export KERNELSOURCE='https://github.com/JamiKettunen/linux-mainline-oneplus5'
export PACKAGE_LIST_FAMILY="mkbootimg" # mkbootimg for creating fastboot compatible kernel.gz+dtb+initrd+cmdline+offset bundle

# Bootloader related, ripped from pmos deviceinfo file. @TODO: create an extension that imports those from a deviceinfo URL (with caching)
export deviceinfo_kernel_cmdline="cmdline_from=pmOS not_used=at_all"
export deviceinfo_flash_offset_base="0x00000000"
export deviceinfo_flash_offset_kernel="0x00008000"
export deviceinfo_flash_offset_ramdisk="0x01000000"
export deviceinfo_flash_offset_second="0x00f00000"
export deviceinfo_flash_offset_tags="0x00000100"
export deviceinfo_flash_pagesize="4096"
export deviceinfo_flash_sparse="true"

case $BRANCH in
	current)
		export KERNEL_MAJOR_MINOR="5.10" # Major and minor versions of this kernel.
		export KERNELBRANCH='branch:v5.10-lts'
		export KERNELDIR='linux-msm8998-v510lts'
		;;
		## Disabled, 5.12 has edge case with rc1 tag ## edge)
		## Disabled, 5.12 has edge case with rc1 tag ## 	export KERNEL_MAJOR_MINOR="5.12" # Major and minor versions of this kernel.
		## Disabled, 5.12 has edge case with rc1 tag ## 	export KERNELBRANCH='branch:v5.12'
		## Disabled, 5.12 has edge case with rc1 tag ## 	export KERNELDIR='linux-msm8998'
		## Disabled, 5.12 has edge case with rc1 tag ## 	;;
esac
