# Pass through my volume if it exists: /Volumes/LinuxDev
if [[ -d /Volumes/LinuxDev2 ]]; then
	declare -g DOCKER_EXTRA_ARGS+=("--mount" "type=bind,source=/Volumes/LinuxDev,target=/Volumes/LinuxDev")
	mkdir -p "${SRC}/cache/dockershellhome" # store the homedir in cache
	declare -g DOCKER_EXTRA_ARGS+=("--mount" "type=bind,source=${SRC}/cache/dockershellhome,target=/root")
	display_alert "added extra volume for Docker" "/Volumes/LinuxDev & /root" "warn"
fi

# Hack for bananapif3 which requires moderner compilers
if [[ $BOARD == "bananapif3" ]]; then
	display_alert "Using noble Docker for" "bananapif3" "warn"
	declare -g DOCKER_ARMBIAN_BASE_IMAGE="ubuntu:noble"
fi

# My cm3588-nas boards use a Noctua 4-pin pwm fan, for which I have a separate dtb instead of an overlay, as I'm lazy and overlays require contant fiddling.
if [[ $BOARD == "cm3588-nas" ]]; then
	function post_family_config__900_pwm_4pin_dtb() {
		declare orig_dtb="${BOOT_FDT_FILE}"
		case "${BRANCH}" in
			vendor | legacy)
				declare -g BOOT_FDT_FILE="rockchip/rk3588-nanopc-cm3588-nas-40pin-pwm-fan.dtb"
				display_alert "Override FDT for ${BOARD}/${BRANCH}" "${BOOT_FDT_FILE} - 4-pin pwm fan vendor (orig: $orig_dtb)" "warn"
				;;
			*)
				BOOT_FDT_FILE="rockchip/rk3588-friendlyelec-cm3588-nas-40pin-pwm-fan.dtb"
				display_alert "Override FDT for ${BOARD}/${BRANCH}" "${BOOT_FDT_FILE} - 4-pin pwm fan mainline (orig: $orig_dtb)" "warn"
				;;
		esac
	}
fi

